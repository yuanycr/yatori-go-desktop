name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update
        required: true
        default: v0.4.2

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      # frontend/dist is intentionally ignored by Git. Build it on the runner
      # before Wails embeds the assets into the Windows executable.
      - name: Build frontend assets
        run: npm --prefix frontend run build

      - name: Fetch local core dependency
        shell: pwsh
        run: |
          git init ../yatori-go-console
          git -C ../yatori-go-console remote add origin https://github.com/yatori-dev/yatori-go-console.git
          git -C ../yatori-go-console fetch --depth 1 origin b003030ccb53209bf56977596dbc6c0d6cfb71e4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C ../yatori-go-console checkout --detach FETCH_HEAD

      - name: Verify Go toolchain and core
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = "local"
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          go version
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./service/... ./mobilecore/... -count=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 executable
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\ucrt64\bin;$env:Path"
          $env:GOTOOLCHAIN = "local"
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          wails build -s -skipbindings -platform windows/amd64 -o yatori-go-desktop-v0.4.2-windows-amd64.exe

      - name: Replace release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" "build/bin/yatori-go-desktop-v0.4.2-windows-amd64.exe" --clobber --repo "${{ github.repository }}"
